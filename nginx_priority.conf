server {
    if ($host = botdefazer.duckdns.org) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name botdefazer.duckdns.org;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name botdefazer.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/botdefazer.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/botdefazer.duckdns.org/privkey.pem;

    root /opt/mro_dash/site;
    index index.html;

    # Version A - Priority Block for /me
    # Placé tout en haut pour garantir la priorité absolue
    location ^~ /me {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Anti-cache agressif
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "-1" always;
    }

    # Route de test pour vérifier que Nginx écoute bien les locations spécifiques
    location = /fraise-test {
        return 200 "<h1>TEST FRAISE PAGE PERSO - CA MARCHE ! 🍓</h1>";
        add_header Content-Type text/html;
    }

    # Proxy dynamic routes to Flask
    location /login {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /callback {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files
    location = /fcoin {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
