<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <style>
      .stroke { fill: none; stroke: #ffffff; stroke-width: 10; }
      .thin   { fill: none; stroke: #ffffff; stroke-width: 6; opacity: 0.85; }
      .phi    { fill: #ffffff; font-family: serif; font-size: 84px; font-weight: 700; }
    </style>
  </defs>
  <!-- Fond transparent -->
  <rect x="0" y="0" width="256" height="256" fill="none"/>

  <!-- Motif de résonance : cercles concentriques -->
  <circle class="stroke" cx="128" cy="128" r="96"/>
  <circle class="thin"   cx="128" cy="128" r="72"/>
  <circle class="thin"   cx="128" cy="128" r="48"/>

  <!-- Lobes latéraux (résonances croisées) -->
  <circle class="thin" cx="128" cy="128" r="88" transform="translate(-28,0)"/>
  <circle class="thin" cx="128" cy="128" r="88" transform="translate(28,0)"/>
  <circle class="thin" cx="128" cy="128" r="88" transform="translate(0,-28)"/>
  <circle class="thin" cx="128" cy="128" r="88" transform="translate(0,28)"/>

  <!-- Symbole central Φ -->
  <text class="phi" x="128" y="146" text-anchor="middle">Φ</text>
</svg>

